<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coordinates</title>
<style>
  :root {
    --bg: #f4f7f2;
    --fg: #14231a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f1a13; --fg: #e8f3ea; }
  }
  :root[data-theme="dark"] { --bg: #0f1a13; --fg: #e8f3ea; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
    box-sizing: border-box;
  }
  #out {
    font-size: clamp(1.8rem, 9vw, 4rem);
    line-height: 1.3;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  #out span { display: block; }
</style>
</head>
<body>
  <div id="out" aria-live="polite"></div>
<script>
  var out = document.getElementById("out");
  function show(lines) {
    out.innerHTML = "";
    lines.forEach(function (t) {
      var s = document.createElement("span");
      s.textContent = t;
      out.appendChild(s);
    });
  }
  if (!navigator.geolocation) {
    show(["Location is not supported."]);
  } else {
    show(["…"]);
    navigator.geolocation.watchPosition(
      function (p) {
        show([p.coords.latitude.toFixed(5), p.coords.longitude.toFixed(5)]);
      },
      function () {
        show(["Location blocked. Allow location access for this page and reload."]);
      },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
    );
  }
</script>
</body>
</html>
