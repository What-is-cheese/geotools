<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bearing &amp; Distance Navigator</title>
<style>
:root{--bg:#fff;--panel:#fff;--fg:#000;--bd:#000;--btn:#fff;--lcd:#fff;--err:#000;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--panel:#000;--fg:#fff;--bd:#fff;--btn:#000;--lcd:#000;--err:#fff}}
:root[data-theme="dark"]{--bg:#000;--panel:#000;--fg:#fff;--bd:#fff;--btn:#000;--lcd:#000;--err:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Courier New",Courier,monospace;font-size:16px;line-height:1.4}
main{max-width:480px;margin:0 auto;padding:10px}
h1{font-size:18px;margin:0 0 10px;padding:0 0 6px;border-bottom:1px solid var(--bd);font-weight:bold}
fieldset{border:1px solid var(--bd);margin:0 0 10px;padding:8px;background:var(--panel)}
legend{padding:0 6px;font-weight:bold;font-size:14px}
.lcd{background:var(--lcd);border:1px solid var(--bd);padding:6px;min-height:3.2em;overflow-wrap:anywhere}
label{display:block;margin:6px 0 2px;font-size:14px}
input{width:100%;font:inherit;font-size:18px;padding:8px;border:1px solid var(--bd);border-radius:0;background:var(--bg);color:var(--fg)}
button,a.btn{display:block;width:100%;margin-top:8px;padding:12px;font:inherit;text-align:center;text-decoration:none;color:var(--fg);background:var(--btn);border:1px solid var(--bd);border-radius:0;cursor:pointer}
button:active,a.btn:active{background:var(--fg);color:var(--bg)}
a.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.err{color:var(--err);font-weight:bold;margin-top:6px}
.small{font-size:13px;margin-top:6px}
</style>
</head>
<body>
<main>
<h1>Bearing &amp; Distance Navigator</h1>

<fieldset>
<legend>Current position</legend>
<div class="lcd" id="cur">LAT: ---<br>LON: ---<br>ACC: ---</div>
<button type="button" id="refresh">Refresh GPS</button>
</fieldset>

<fieldset>
<legend>Target</legend>
<label for="brg">Bearing (0–360°) 0=N 90=E 180=S 270=W</label>
<input id="brg" type="number" inputmode="decimal" min="0" max="360" step="any" placeholder="e.g. 45">
<label for="dst">Distance (meters)</label>
<input id="dst" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 500">
<button type="button" id="calc">Calculate</button>
<div class="err" id="err" role="alert"></div>
</fieldset>

<fieldset>
<legend>Destination</legend>
<div class="lcd" id="out">LAT: ---<br>LON: ---<br>BRG: ---<br>DST: ---</div>
<a class="btn" id="map" href="#" target="_blank" rel="noopener noreferrer" aria-disabled="true">Open on map</a>
<div class="small">Calculated on a spherical Earth (radius 6371 km). Error is typically well under 0.5% at these distances. Map: OpenStreetMap.</div>
</fieldset>
</main>

<script>
(function(){
  var R=6371008.8, $=function(i){return document.getElementById(i)};
  var pos=null;

  function rad(d){return d*Math.PI/180}
  function deg(r){return r*180/Math.PI}

  function destination(lat,lon,brg,dist){
    var f1=rad(lat), l1=rad(lon), t=rad(brg), d=dist/R;
    var f2=Math.asin(Math.sin(f1)*Math.cos(d)+Math.cos(f1)*Math.sin(d)*Math.cos(t));
    var l2=l1+Math.atan2(Math.sin(t)*Math.sin(d)*Math.cos(f1),Math.cos(d)-Math.sin(f1)*Math.sin(f2));
    return {lat:deg(f2),lon:((deg(l2)+540)%360)-180};
  }

  function geoError(e){
    if(e.code===1) return "Location permission denied. Allow location access for this site in the browser settings and try again.";
    if(e.code===2) return "Position unavailable. Check that GPS/location is switched on and try outdoors.";
    if(e.code===3) return "Location request timed out. Try again.";
    return "Location error: "+(e.message||"unknown");
  }

  function getPos(ok,fail){
    if(!("geolocation" in navigator)){fail("Geolocation is not supported by this browser.");return}
    if(window.isSecureContext===false){fail("Location needs a secure (https) connection.");return}
    navigator.geolocation.getCurrentPosition(function(p){
      pos=p.coords;
      $("cur").innerHTML="LAT: "+pos.latitude.toFixed(6)+"<br>LON: "+pos.longitude.toFixed(6)+"<br>ACC: ±"+Math.round(pos.accuracy)+" m";
      ok(pos);
    },function(e){fail(geoError(e))},{enableHighAccuracy:true,timeout:20000,maximumAge:0});
  }

  function setErr(m){$("err").textContent=m||""}

  $("refresh").addEventListener("click",function(){
    setErr(""); $("cur").innerHTML="Acquiring position...";
    getPos(function(){},function(m){$("cur").innerHTML="LAT: ---<br>LON: ---<br>ACC: ---";setErr(m)});
  });

  $("calc").addEventListener("click",function(){
    setErr("");
    var bs=$("brg").value.trim(), ds=$("dst").value.trim();
    var b=Number(bs), d=Number(ds);
    if(bs===""||!isFinite(b)||b<0||b>360){setErr("Enter a bearing between 0 and 360 degrees.");return}
    if(ds===""||!isFinite(d)||d<=0){setErr("Enter a distance greater than 0 meters.");return}
    var btn=$("calc"); btn.disabled=true; $("cur").innerHTML="Acquiring position...";
    getPos(function(p){
      btn.disabled=false;
      var r=destination(p.latitude,p.longitude,b,d);
      var la=r.lat.toFixed(6), lo=r.lon.toFixed(6);
      $("out").innerHTML="LAT: "+la+"<br>LON: "+lo+"<br>BRG: "+b+"°<br>DST: "+d+" m";
      var a=$("map");
      a.href="https://www.openstreetmap.org/?mlat="+la+"&mlon="+lo+"#map=17/"+la+"/"+lo;
      a.setAttribute("aria-disabled","false");
    },function(m){
      btn.disabled=false;
      $("cur").innerHTML="LAT: ---<br>LON: ---<br>ACC: ---";
      setErr(m);
    });
  });
})();
</script>
</body>
</html>
