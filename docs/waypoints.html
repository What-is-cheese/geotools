<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waypoint Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
body{background:#fff;color:#000;margin:10px}
#map{height:420px;max-width:100%;border:1px solid #000;margin:10px 0}
.pt{width:12px;height:12px;border:2px solid #000;border-radius:50%}
.pt.sel{outline:2px solid #000;outline-offset:2px}
.pt.lbl{width:22px;height:22px;line-height:22px;text-align:center;font:bold 12px Arial,sans-serif;overflow:hidden}
.me{width:14px;height:14px;background:#0ff;border:2px solid #000}
.sw{display:inline-block;width:12px;height:12px;border:1px solid #000;vertical-align:middle}
.err{color:#c00}
input[type=text]{max-width:100%}
form{margin:10px 0}
body.picking #map{cursor:crosshair;touch-action:none}
progress{width:300px;max-width:100%}
</style>
</head>
<body>
<h1>Waypoint Map</h1>

<button type="button" id="gpsBtn">Create Point From Location</button>
<button type="button" id="dlBtn">Download Map Area</button>
<p id="msg" class="err" role="alert"></p>
<p id="netStatus" role="status"></p>
<ul id="syncNotes" class="err"></ul>
<button type="button" id="syncClear" hidden>Dismiss</button>

<form id="gpsForm" hidden>
  <p id="gpsCoords"></p>
  <p><label>Name (required): <input type="text" id="gpsName" maxlength="80" autocomplete="off"></label></p>
  <p><label>Color: <select id="gpsColor"></select></label></p>
  <button type="submit">Create Waypoint</button>
  <button type="button" id="gpsCancel">Cancel</button>
  <span class="err" id="gpsErr" role="alert"></span>
</form>

<div id="map"></div>

<div id="dlBox" hidden>
  <p id="dlHelp"></p>
  <form id="dlForm" hidden>
    <p><label>Name (required): <input type="text" id="dlName" maxlength="80" autocomplete="off"></label></p>
    <p><label>Map detail: <select id="dlZoom">
      <option value="10">Zoom 10 - cities and main roads</option>
      <option value="11">Zoom 11 - main roads and towns</option>
      <option value="12">Zoom 12 - most roads</option>
      <option value="13">Zoom 13 - all roads and many paths</option>
      <option value="14" selected>Zoom 14 - full detail, buildings and paths</option>
    </select></label></p>
    <p><label><input type="checkbox" id="dlRoads" checked> Routing data (Crazy Mode and Normal Mode offline)</label><br>
    <label><input type="checkbox" id="dlObst" checked> Obstacle data (Bird Mode - Avoid Obstacles offline)</label></p>
    <p id="dlGeoNote"></p>
    <p id="dlEst"></p>
    <button type="submit" id="dlStart">Start Download</button>
  </form>
  <p id="dlRun" hidden><progress id="dlProg" value="0" max="1"></progress> <span id="dlProgText"></span></p>
  <button type="button" id="dlCancel">Cancel</button>
  <span class="err" id="dlErr" role="alert"></span>
</div>

<h2>Selected waypoint</h2>
<div id="selInfo"></div>

<form id="fromForm" hidden>
  <p><label>Name (required): <input type="text" id="fName" maxlength="80" autocomplete="off"></label></p>
  <p><label>Distance (meters): <input type="text" id="fDist" inputmode="decimal" autocomplete="off"></label></p>
  <p><label>Direction (degrees): <input type="text" id="fBrg" inputmode="decimal" autocomplete="off"></label> 0 = North, 90 = East, 180 = South, 270 = West</p>
  <p><label>Color: <select id="fColor"></select></label></p>
  <button type="submit">Create Waypoint</button>
  <button type="button" id="fCancel">Cancel</button>
  <span class="err" id="fErr" role="alert"></span>
</form>

<form id="editForm" hidden>
  <p><label>Name: <input type="text" id="eName" maxlength="80" autocomplete="off"></label></p>
  <button type="submit">Save name</button>
  <button type="button" id="eCancel">Cancel</button>
  <span class="err" id="eErr" role="alert"></span>
</form>

<form id="colorForm" hidden>
  <p><label>Color: <select id="cColor"></select></label></p>
  <button type="submit">Save color</button>
  <button type="button" id="cCancel">Cancel</button>
</form>

<h2>Waypoints (<span id="count">0</span>)</h2>
<ul id="list"></ul>

<h2>Route</h2>
<p><label>Route mode: <select id="rModeSel"></select></label><br>Selected: <b id="rModeNow"></b> <span id="rModeDesc"></span></p>
<p><label>Travel mode (Normal and Crazy modes): <select id="rMode"><option value="car">Driving</option><option value="bike">Cycling</option><option value="foot">Walking</option></select></label></p>
<div id="rPlan"></div>
<p>
  <button type="button" id="rCreate">Create Route</button>
  <button type="button" id="rStart">Start Navigation</button>
  <button type="button" id="rStop">Stop Navigation</button>
  <button type="button" id="rRecalc">Recalculate Route</button>
  <button type="button" id="rClear">Clear Route</button>
</p>
<p id="rErr" class="err" role="alert"></p>
<div id="rInfo"></div>
<div id="navInfo"></div>

<h2>Downloaded Maps</h2>
<p id="storeInfo"></p>
<ul id="areaList"></ul>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.93.0/dist/umd/supabase.min.js"></script>
<script src="offline-tiles.js"></script>
<script src="offline-store.js"></script>
<script src="offline-router.js"></script>
<script src="offline-sync.js"></script>
<script>
(function(){
  // Shared database (Supabase). Fill in your project values; see supabase-setup.sql.
  var SUPABASE_URL = 'https://wjxqwrftktiqkkuulrzx.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_UuwP69YWr6byL-TSpLsG5A__gkxE3_J';
  var MAX_DIST = 20003931; // about half of Earth's circumference, in meters
  var $ = function(id){ return document.getElementById(id); };

  // ---- Geodesy: Vincenty direct solution on the WGS-84 ellipsoid.
  // Inputs: start lat/lng (degrees), bearing (degrees clockwise from north), distance (meters).
  function normBearing(b){ return ((b % 360) + 360) % 360; }
  function normLng(l){ return (((l + 540) % 360) + 360) % 360 - 180; }
  function destination(lat, lng, bearing, dist){
    var a = 6378137, f = 1/298.257223563, b = (1-f)*a, rad = Math.PI/180;
    var phi1 = Math.max(-89.999999999, Math.min(89.999999999, lat)) * rad, al1 = normBearing(bearing) * rad;
    var sA = Math.sin(al1), cA = Math.cos(al1);
    var tU1 = (1-f)*Math.tan(phi1), cU1 = 1/Math.sqrt(1+tU1*tU1), sU1 = tU1*cU1;
    var s1 = Math.atan2(tU1, cA), sAl = cU1*sA, cSqAl = 1 - sAl*sAl, uSq = cSqAl*(a*a-b*b)/(b*b);
    var A = 1 + uSq/16384*(4096+uSq*(-768+uSq*(320-175*uSq)));
    var B = uSq/1024*(256+uSq*(-128+uSq*(74-47*uSq)));
    var sig = dist/(b*A), sigP, sS, cS, c2, dS, i = 0;
    do {
      c2 = Math.cos(2*s1+sig); sS = Math.sin(sig); cS = Math.cos(sig);
      dS = B*sS*(c2+B/4*(cS*(-1+2*c2*c2)-B/6*c2*(-3+4*sS*sS)*(-3+4*c2*c2)));
      sigP = sig; sig = dist/(b*A) + dS;
    } while(Math.abs(sig-sigP) > 1e-12 && ++i < 100);
    var x = sU1*sS - cU1*cS*cA;
    var phi2 = Math.atan2(sU1*cS + cU1*sS*cA, (1-f)*Math.sqrt(sAl*sAl + x*x));
    var lam = Math.atan2(sS*sA, cU1*cS - sU1*sS*cA);
    var C = f/16*cSqAl*(4+f*(4-3*cSqAl));
    var Ld = lam - (1-C)*f*sAl*(sig + C*sS*(c2+C*cS*(-1+2*c2*c2)));
    return {lat: phi2/rad, lng: normLng(lng + Ld/rad)};
  }

  // ---- Storage. Waypoints and lines live in the shared Supabase database, with a copy in IndexedDB for offline use.
  // localStorage only remembers this user's own route plan (start, stops, end, modes).
  var PLAN_KEY = 'waypoint-map.plan.v1', plan = {};
  try { plan = JSON.parse(localStorage.getItem(PLAN_KEY)) || {}; } catch(e){}
  var data = {points:[], links:[], route:plan}, db = null;
  function save(){ try { localStorage.setItem(PLAN_KEY, JSON.stringify(plan)); } catch(e){} }

  // ---- Helpers
  var selectedId = null, markers = {}, lineLayers = [], gpsPos = null;
  function byId(id){ return data.points.filter(function(p){ return p.id === id; })[0]; }
  function newId(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){ var r = Math.random()*16|0; return (c === 'x' ? r : (r&3|8)).toString(16); });
  }
  function fmt(n){ return Number(n).toFixed(6); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function say(t){ $('msg').textContent = t || ''; }
  function num(v){ return parseFloat(String(v).trim().replace(',', '.')); }
  function rowOf(p){ return {id:p.id, name:p.name, lat:p.lat, lng:p.lng, color:p.color}; }
  function hideForms(){
    ['gpsForm','fromForm','editForm','colorForm'].forEach(function(id){ $(id).hidden = true; });
    ['gpsErr','fErr','eErr'].forEach(function(id){ $(id).textContent = ''; });
  }

  // ---- Map
  var map = L.map('map').setView([20, 0], 2);
  var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  var COLORS = {red:'#ff0000', blue:'#0000ff', green:'#008000', yellow:'#ffff00', orange:'#ffa500', purple:'#800080', black:'#000000', white:'#ffffff'};
  function hex(p){ return COLORS[p.color] || COLORS.red; }
  function icon(p, sel){
    var nm = p.name.trim(), short = Array.from(nm).length < 3, sz = short ? 26 : 16;   // names under 3 characters sit on the marker
    var dark = ['red','blue','green','purple','black'].indexOf(p.color) >= 0;
    return L.divIcon({className:'', html:'<div class="pt'+(sel ? ' sel' : '')+(short ? ' lbl' : '')+'" style="background:'+hex(p)+';color:'+(dark ? '#fff' : '#000')+'">'+(short ? esc(nm) : '')+'</div>',
      iconSize:[sz,sz], iconAnchor:[sz/2,sz/2], popupAnchor:[0,-sz/2]});
  }
  var meIcon = L.divIcon({className:'', html:'<div class="me"></div>', iconSize:[18,18], iconAnchor:[9,9]});
  function fillColors(sel){
    Object.keys(COLORS).forEach(function(k){
      var o = document.createElement('option'); o.value = k; o.textContent = k.charAt(0).toUpperCase() + k.slice(1); sel.appendChild(o);
    });
    sel.value = 'red';
  }

  function popupText(p){ return '<b>'+esc(p.name)+'</b><br>Latitude: '+fmt(p.lat)+'<br>Longitude: '+fmt(p.lng); }
  function addMarker(p){
    var m = L.marker([p.lat, p.lng], {icon:icon(p, false), title:p.name}).addTo(map);
    m.bindPopup(popupText(p));
    m.on('click', function(){ select(p.id, false); });
    markers[p.id] = m;
  }
  function drawLines(){
    lineLayers.forEach(function(l){ map.removeLayer(l); });
    lineLayers = [];
    data.links.forEach(function(k){
      var a = byId(k.from), b = byId(k.to);
      if(!a || !b) return;
      var lng2 = b.lng;                       // keep the line short across the date line
      while(lng2 - a.lng > 180) lng2 -= 360;
      while(lng2 - a.lng < -180) lng2 += 360;
      lineLayers.push(L.polyline([[a.lat, a.lng], [b.lat, lng2]], {color:'#000', weight:2}).addTo(map));
    });
  }

  // ---- Selection and rendering
  function select(id, locate){
    hideForms();
    selectedId = id;
    Object.keys(markers).forEach(function(k){ markers[k].setIcon(icon(byId(k), k === id)); });
    renderList(); renderSelected(); renderPlan();
    if(locate && id && markers[id]){
      var p = byId(id);
      map.setView([p.lat, p.lng], Math.max(map.getZoom(), 17));
      markers[id].openPopup();
    }
  }

  function button(label, fn){
    var b = document.createElement('button'); b.type = 'button'; b.textContent = label;
    b.addEventListener('click', fn); return b;
  }

  function renderSelected(){
    var box = $('selInfo'); box.innerHTML = '';
    var p = selectedId && byId(selectedId);
    if(!p){ box.textContent = 'No waypoint selected.'; return; }
    var info = document.createElement('p');
    info.innerHTML = 'Name: '+esc(p.name)+'<br>Latitude: '+fmt(p.lat)+'<br>Longitude: '+fmt(p.lng)+'<br>Color: '+esc(p.color)+' <span class="sw" style="background:'+hex(p)+'"></span><br>Status: '+(sync.waiting(p.id) ? 'Waiting to synchronize' : 'Synchronized');
    box.appendChild(info);
    box.appendChild(button('Create Point From This Waypoint', function(){
      hideForms(); $('fName').value = ''; $('fDist').value = ''; $('fBrg').value = ''; $('fColor').value = 'red';
      $('fromForm').hidden = false; $('fName').focus();
    }));
    box.appendChild(document.createTextNode(' '));
    box.appendChild(button('Edit name', function(){
      hideForms(); $('eName').value = p.name; $('editForm').hidden = false; $('eName').focus();
    }));
    box.appendChild(document.createTextNode(' '));
    box.appendChild(button('Change color', function(){
      hideForms(); $('cColor').value = p.color; $('colorForm').hidden = false; $('cColor').focus();
    }));
    box.appendChild(document.createTextNode(' '));
    box.appendChild(button('Delete', function(){
      if(!confirm('Delete waypoint "' + p.name + '"?')) return;
      queueChange({t:'delete', id:p.id, base:{name:p.name, color:p.color}});   // its lines are removed by the database
      removePoint(p.id);
    }));
  }

  function renderList(){
    cacheData();
    $('count').textContent = data.points.length;
    var ul = $('list'); ul.innerHTML = '';
    if(!data.points.length){ ul.innerHTML = '<li>No waypoints yet.</li>'; return; }
    data.points.forEach(function(p){
      var li = document.createElement('li');
      var sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = hex(p); sw.title = p.color;
      li.appendChild(sw); li.appendChild(document.createTextNode(' '));
      var b = button(p.name, function(){ select(p.id, true); });
      if(p.id === selectedId) b.style.fontWeight = 'bold';
      li.appendChild(b);
      li.appendChild(document.createTextNode(' ' + fmt(p.lat) + ', ' + fmt(p.lng) + (sync.waiting(p.id) ? ' (waiting to synchronize)' : '')));
      ul.appendChild(li);
    });
  }

  // ---- Create Point From Location
  // The browser asks for permission the first time getCurrentPosition is called.
  $('gpsBtn').addEventListener('click', function(){
    say(''); hideForms();
    if(!('geolocation' in navigator)){ say('This browser does not support location access.'); return; }
    if(!window.isSecureContext){ say('Location access needs a secure page (HTTPS or localhost).'); return; }
    var btn = $('gpsBtn'); btn.disabled = true; say('Getting your location...');
    navigator.geolocation.getCurrentPosition(function(pos){
      btn.disabled = false; say('');
      gpsPos = {lat: pos.coords.latitude, lng: pos.coords.longitude};
      $('gpsCoords').textContent = 'Your location: ' + fmt(gpsPos.lat) + ', ' + fmt(gpsPos.lng);
      $('gpsName').value = ''; $('gpsColor').value = 'red';
      map.setView([gpsPos.lat, gpsPos.lng], 17);
      $('gpsForm').hidden = false; $('gpsName').focus();
    }, function(err){
      btn.disabled = false;
      say(err.code === 1 ? 'Location permission was denied. Allow location access for this site in the browser settings and try again.'
        : err.code === 2 ? 'Your location is unavailable. Check that location services are on.'
        : err.code === 3 ? 'Getting your location timed out. Try again.'
        : 'Could not get your location.');
    }, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
  });
  $('gpsCancel').addEventListener('click', function(){ hideForms(); gpsPos = null; });
  $('gpsForm').addEventListener('submit', function(e){
    e.preventDefault();
    var name = $('gpsName').value.trim();
    if(!name){ $('gpsErr').textContent = 'A name is required.'; return; }
    if(!gpsPos) return;
    var p = {id:newId(), name:name, lat:gpsPos.lat, lng:gpsPos.lng, color:$('gpsColor').value};
    data.points.push(p); addMarker(p); gpsPos = null;
    queueChange({t:'insert', row:rowOf(p)});
    select(p.id, true);
  });

  // ---- Create Point From This Waypoint
  $('fCancel').addEventListener('click', hideForms);
  $('fromForm').addEventListener('submit', function(e){
    e.preventDefault();
    var src = selectedId && byId(selectedId); if(!src) return;
    var name = $('fName').value.trim(), d = num($('fDist').value), b = num($('fBrg').value), err = $('fErr');
    if(!name){ err.textContent = 'A name is required.'; return; }
    if(!(d > 0)){ err.textContent = 'Enter a distance greater than 0 meters.'; return; }
    if(d > MAX_DIST){ err.textContent = 'The distance can be at most 20,003,931 meters.'; return; }
    if(!isFinite(b)){ err.textContent = 'Enter a direction in degrees (0 to 360).'; return; }
    var q = destination(src.lat, src.lng, normBearing(b), d);
    var p = {id:newId(), name:name, lat:q.lat, lng:q.lng, color:$('fColor').value};
    var lk = {id:newId(), from:src.id, to:p.id};
    data.points.push(p); data.links.push(lk); addMarker(p); drawLines();
    sync.add({t:'insert', row:rowOf(p)});
    queueChange({t:'link', row:{id:lk.id, from_id:lk.from, to_id:lk.to}});
    map.fitBounds([[src.lat, src.lng], [p.lat, p.lng]], {padding:[60,60], maxZoom:19, animate:false});
    select(p.id, false);
    markers[p.id].openPopup();
  });

  // ---- Edit name
  $('eCancel').addEventListener('click', hideForms);
  $('editForm').addEventListener('submit', function(e){
    e.preventDefault();
    var p = selectedId && byId(selectedId); if(!p) return;
    var name = $('eName').value.trim();
    if(!name){ $('eErr').textContent = 'A name is required.'; return; }
    if(name !== p.name) queueChange({t:'update', id:p.id, field:'name', value:name, base:p.name});
    p.name = name;
    markers[p.id].setPopupContent(popupText(p)); markers[p.id].options.title = name;
    select(p.id, false);
  });

  // ---- Change color
  $('cCancel').addEventListener('click', hideForms);
  $('colorForm').addEventListener('submit', function(e){
    e.preventDefault();
    var p = selectedId && byId(selectedId); if(!p) return;
    var color = $('cColor').value;
    if(color !== p.color) queueChange({t:'update', id:p.id, field:'color', value:color, base:p.color});
    p.color = color;
    select(p.id, false);
  });

  // ---- Routing (OSRM, FOSSGIS servers: car, bike and foot profiles; real roads and paths)
  var MODES = {car:'Driving', bike:'Cycling', foot:'Walking'};
  var planLayer = null, planRoute = null, planToken = 0, nav = null, userMarker = null;
  var ARRIVE_M = 30, MOVE_M = 150, OFF_M = 50, MIN_GAP = 8000;
  function rerr(t){ $('rErr').textContent = t || ''; }
  function fmtDist(m){ return m < 1000 ? Math.round(m) + ' m' : (m/1000).toFixed(2) + ' km'; }
  function fmtTime(s){
    var m = Math.max(1, Math.round(s/60));
    return m < 60 ? m + ' min' : Math.floor(m/60) + ' h ' + (m % 60) + ' min';
  }
  function hav(a, b){
    var R = 6371008.8, r = Math.PI/180, dLa = (b.lat-a.lat)*r, dLo = (b.lng-a.lng)*r;
    var x = Math.sin(dLa/2)*Math.sin(dLa/2) + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)*Math.sin(dLo/2);
    return 2*R*Math.asin(Math.sqrt(x));
  }
  function dlng(a, b){ return (((a - b + 540) % 360) + 360) % 360 - 180; }
  // distance in meters from pos to the nearest point of a route line ([lat,lng] pairs)
  function offRoute(pos, line){
    var k = 111320, c = Math.cos(pos.lat*Math.PI/180), best = Infinity;
    for(var i = 0; i < line.length - 1; i++){
      var ax = dlng(line[i][1], pos.lng)*c*k, ay = (line[i][0]-pos.lat)*k;
      var bx = dlng(line[i+1][1], pos.lng)*c*k, by = (line[i+1][0]-pos.lat)*k;
      var dx = bx-ax, dy = by-ay, l2 = dx*dx + dy*dy;
      var t = l2 ? Math.max(0, Math.min(1, -(ax*dx + ay*dy)/l2)) : 0;
      var px = ax + t*dx, py = ay + t*dy;
      best = Math.min(best, Math.sqrt(px*px + py*py));
    }
    return best;
  }

  // Returns a promise for {distance, duration, line}. The route passes through every point, in the given order.
  function fetchRoute(mode, pts){
    var ctl = new AbortController(), t = setTimeout(function(){ ctl.abort(); }, 20000);
    var coords = pts.map(function(p){ return p.lng.toFixed(6) + ',' + p.lat.toFixed(6); }).join(';');
    var url = 'https://routing.openstreetmap.de/routed-' + mode + '/route/v1/driving/' + coords + '?overview=full&geometries=geojson&steps=false';
    return fetch(url, {signal: ctl.signal}).then(function(r){
      clearTimeout(t);
      return r.json().catch(function(){ throw new Error('The routing service returned an error (HTTP ' + r.status + ').'); });
    }).then(function(j){
      if(j.code === 'NoRoute') throw new Error('No route was found between these points for this travel mode.');
      if(j.code === 'NoSegment') throw new Error('A waypoint is too far from any road or path for this travel mode.');
      if(j.code !== 'Ok' || !j.routes || !j.routes.length) throw new Error('The routing service returned: ' + (j.message || j.code || 'an error') + '.');
      var r = j.routes[0];
      return {distance:r.distance, duration:r.duration, line:r.geometry.coordinates.map(function(c){ return [c[1], c[0]]; })};
    }).catch(function(e){
      clearTimeout(t);
      if(e.name === 'AbortError') throw new Error('The routing service did not respond in time.');
      if(e instanceof TypeError) throw new Error('Could not reach the routing service. Check your internet connection.');
      throw e;
    });
  }

  // ---- Route plan (start, intermediate waypoints in order, end)
  function stops(){ return [plan.start].concat(plan.via, [plan.end]).map(byId); }
  function validatePlan(){
    if(!plan.start) return 'Choose a starting waypoint.';
    if(!plan.end) return 'Choose an ending waypoint.';
    if(plan.start === plan.end && !plan.via.length) return 'Choose a different starting and ending waypoint.';
    return '';
  }
  function onPlanChanged(){
    planToken++; planRoute = null;

    }).then(function(){
      if(tok !== estToken) return;
      var total = keys.reduce(function(a, k){ return a + sizes[k]; }, 0), bytes = total/keys.length*n + ASSET_BYTES;
      if(bytes > GeoTiles.LIMITS.bytes){
        est.textContent = n + ' map tiles, about ' + fmtBytes(bytes) + '. The limit is ' + fmtBytes(GeoTiles.LIMITS.bytes) + ' for one download. Choose a lower detail level or draw a smaller area.';
        return;
      }
      est.textContent = n + ' map tiles, about ' + fmtBytes(bytes) + '.' + extra();
      $('dlStart').disabled = false;
    }).catch(function(e){
      if(tok === estToken) est.textContent = 'Could not estimate the size (' + e.message + ').';
    });
  }
  ['dlZoom','dlRoads','dlObst'].forEach(function(id){ $(id).addEventListener('change', function(){ if(pick && pick.bb) estimate(); }); });

  $('dlCancel').addEventListener('click', function(){
    if(job) job.ctl.abort(); else resetDl();
  });
  $('dlForm').addEventListener('submit', function(e){
    e.preventDefault();
    if(!pick || !pick.bb || job) return;
    var name = $('dlName').value.trim();
    if(!name){ $('dlErr').textContent = 'A name is required.'; return; }
    var a = {id:newId(), name:name, bb:pick.bb, zmax:+$('dlZoom').value, status:'downloading', bytes:0, tiles:0, date:Date.now(),
      roads:$('dlRoads').checked ? 'wanted' : 'no', obstacles:$('dlObst').checked ? 'wanted' : 'no'};
    resetDl(); $('dlName').value = '';
    runDownload(a, null);
  });

  function progress(text){
    $('dlProg').max = job.total || 1; $('dlProg').value = job.done;
    $('dlProgText').textContent = text;
  }
  function tileProgress(){ progress(job.done + ' of ' + job.total + ' map tiles, ' + fmtBytes(job.bytes)); }
  // previous: the stored record when downloading an area again, so cancelling or failing keeps what was there.
  function runDownload(a, previous){
    var keys = GeoTiles.list(a.bb, a.zmax);
    job = {area:a, ctl:new AbortController(), done:0, total:keys.length, bytes:0};
    var signal = job.ctl.signal;
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist();   // ask the browser not to clear the maps under storage pressure
    $('dlBox').hidden = false; $('dlForm').hidden = true; $('dlRun').hidden = false; $('dlHelp').textContent = 'Downloading "' + a.name + '". Keep this page open.';
    $('dlCancel').textContent = 'Cancel Download';
    progress('Starting...');
    (previous ? Promise.resolve() : GeoStore.put('areas', a)).then(reloadAreas).then(function(){ return getTpl(signal); })
      .then(function(){ return saveAssets(signal); })
      .then(function(){ return saveTiles(a, keys, signal); })
      .then(function(){ return saveGeo(a, signal, previous); })
      .then(function(){
        a.status = 'ready'; a.bytes = job.bytes; a.tiles = keys.length; a.date = Date.now();
        return GeoStore.put('areas', a);
      }).then(function(){
        var bad = a.roads === 'failed' || a.obstacles === 'failed';
        finishDownload(bad ? '"' + a.name + '" was downloaded, but its routing or obstacle data was not. Use Download map again later.' : '"' + a.name + '" was downloaded.');
      }).catch(function(e){
        var cancelled = job.cancelled || e.name === 'AbortError';
        var msg = cancelled ? 'The download was cancelled.' : e.name === 'QuotaExceededError' ? 'There is not enough storage space on this device.' : 'The download failed (' + e.message + ').';
        (previous ? GeoStore.put('areas', previous) : GeoStore.deleteArea(a.id)).then(function(){ finishDownload(msg); }, function(){ finishDownload(msg); });
      });
  }
  function finishDownload(msg){
    job = null; resetDl(); say(msg);
    reloadAreas().then(applyBaseMap);
  }
  function saveAssets(signal){
    return getBin(STYLE, signal).then(function(b){
      var style = JSON.parse(new TextDecoder().decode(b)), raster = {}, fonts = {};
      Object.keys(style.sources).forEach(function(k){ if(style.sources[k].type !== 'vector') raster[k] = 1; });
      var keep = Object.keys(style.sources).filter(function(k){ return !raster[k]; })[0];
      var layers = style.layers.filter(function(l){ return !raster[l.source]; });
      layers.forEach(function(l){
        var f = l.layout && l.layout['text-font'];
        (JSON.stringify(f || '').match(/Noto Sans \w+/g) || []).forEach(function(n){ fonts[n] = 1; });
      });
      var sprite = style.sprite, glyphs = style.glyphs, local = Object.assign({}, style, {layers:layers, sources:{}, glyphs:'geotiles://f/{fontstack}/{range}', sprite:'geotiles://s/sprite'});
      local.sources[keep] = {type:'vector', tiles:['geotiles://t/{z}/{x}/{y}'], minzoom:0, maxzoom:14, attribution:GL_ATTR};
      var files = [];
      ['.json', '.png', '@2x.json', '@2x.png'].forEach(function(x){ files.push({url:sprite + x, key:'sprite:sprite' + x}); });
      Object.keys(fonts).forEach(function(f){
        ['0-255', '256-511', '8192-8447'].forEach(function(r){
          files.push({url:glyphs.replace('{fontstack}', encodeURIComponent(f)).replace('{range}', r), key:'font:' + f + ':' + r});
        });
      });
      return files.reduce(function(p, f){
        return p.then(function(){ return getBin(f.url, signal); }).then(function(d){ job.bytes += d.byteLength; return GeoStore.setKV(f.key, d); });
      }, Promise.resolve()).then(function(){ return GeoStore.setKV('style', local); });
    });
  }
  function saveTiles(a, keys, signal){
    var next = 0;
    function worker(){
      if(next >= keys.length) return Promise.resolve();
      var k = keys[next++];
      return getBin(tileUrl(k), signal).then(function(d){
        job.bytes += d.byteLength;
        if(job.bytes > GeoTiles.LIMITS.bytes) throw new Error('the area is larger than the ' + fmtBytes(GeoTiles.LIMITS.bytes) + ' limit');
        return GeoStore.putTile(k, d, a.id);
      }).then(function(){ job.done++; tileProgress(); return worker(); });
    }
    var w = [];
    for(var i = 0; i < GeoTiles.LIMITS.parallel; i++) w.push(worker());
    return Promise.all(w).catch(function(e){ job.ctl.abort(); throw e; });
  }
  function overpass(query, signal, what, tries){
    tries = tries || 0;
    var ctl = new AbortController(), t = setTimeout(function(){ ctl.abort(); }, 120000);
    signal.addEventListener('abort', function(){ ctl.abort(); }, {once:true});
    return fetch('https://overpass-api.de/api/interpreter', {method:'POST', body:'data=' + encodeURIComponent(query), signal:ctl.signal,
      headers:{'Content-Type':'application/x-www-form-urlencoded'}}).then(function(r){
      clearTimeout(t);
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(j){
      if(j.remark) throw new Error(j.remark);    // the server stopped early: the result is incomplete
      return j.elements || [];
    }).catch(function(e){
      clearTimeout(t);
      if(signal.aborted) throw new DOMException('Aborted', 'AbortError');
      if(tries >= 3) throw e;
      var sec = 5*Math.pow(3, tries);
      progress('The map data service is busy. Retrying ' + what + ' in ' + sec + ' seconds...');
      return wait(sec*1000, signal).then(function(){ return overpass(query, signal, what, tries + 1); });
    });
  }
  function compactObstacles(els){
    return els.map(function(el){
      var o = {type:el.type}, t = {};
      KEEP_OBST.forEach(function(k){ if(el.tags && el.tags[k] !== undefined) t[k] = el.tags[k]; });
      o.tags = t;
      ['id','lat','lon','bounds','geometry'].forEach(function(k){ if(el[k] !== undefined) o[k] = el[k]; });
      if(el.members) o.members = el.members.filter(function(m){ return m.type === 'way' && m.geometry; }).map(function(m){ return {type:'way', geometry:m.geometry}; });
      return o;
    });
  }
  function saveGeo(a, signal, previous){
    var box = expand(a.bb), c = '(' + [box.s, box.w, box.n, box.e].map(function(v){ return v.toFixed(5); }).join(',') + ')';
    function step(field, what, query, shrink){
      if(a[field] === 'no') return Promise.resolve();
      progress('Downloading ' + what + '...');
      return overpass(query, signal, what).then(function(els){
        var d = shrink(els);
        job.bytes += JSON.stringify(d).length;
        return GeoStore.put('geo', {k:a.id + ':' + field, d:d});
      }).then(function(){ a[field] = 'ready'; delete graphs[a.id]; }).catch(function(e){
        if(e.name === 'AbortError' || e.name === 'QuotaExceededError') throw e;
        a[field] = previous && previous[field] === 'ready' ? 'ready' : 'failed';    // the tiles are safe; Download map again can retry this
      });
    }
    return step('roads', 'routing data', '[out:json][timeout:90];way["highway"]' + c + ';out body geom;', GeoRouter.compact).then(function(){
      return step('obstacles', 'obstacle data', '[out:json][timeout:90];(' + OBST.map(function(x){ return x + c + ';'; }).join('') + ');out geom;', compactObstacles);
    });
  }

  // ---- Downloaded Maps
  function reloadAreas(){
    return GeoStore.all('areas').then(function(r){ areas = r; renderAreas(); renderStatus(); }).catch(function(){});
  }
  var DATA_TEXT = {ready:'Downloaded', failed:'Failed', no:'Not included', wanted:'Not finished'};
  function renderAreas(){
    var ul = $('areaList'); ul.innerHTML = '';
    if(!areas.length) ul.innerHTML = '<li>No downloaded maps.</li>';
    areas.forEach(function(a){
      var li = document.createElement('li'), p = document.createElement('p'), ok = mapReady(a);
      p.innerHTML = '<b>' + esc(a.name) + '</b><br>Download size: ' + fmtBytes(a.bytes) + ', ' + a.tiles + ' tiles, detail level ' + a.zmax +
        '<br>Downloaded: ' + esc(new Date(a.date).toLocaleDateString()) +
        '<br>Map: ' + (ok ? 'Downloaded' : job && job.area.id === a.id ? 'Downloading...' : 'Not finished') +
        '<br>Routing data: ' + DATA_TEXT[a.roads] + '<br>Obstacle data: ' + DATA_TEXT[a.obstacles];
      li.appendChild(p);
      li.appendChild(button('Show on map', function(){ map.fitBounds([[a.bb.s, a.bb.w], [a.bb.n, a.bb.e]]); }));
      li.appendChild(document.createTextNode(' '));
      var again = button('Download map again', function(){
        if(job) return;
        if(!online){ say('Downloading a map needs an internet connection.'); return; }
        var copy = Object.assign({}, a, {status:a.status, roads:a.roads === 'no' ? 'no' : 'wanted', obstacles:a.obstacles === 'no' ? 'no' : 'wanted'});
        runDownload(copy, ok ? a : null);
      });
      again.disabled = !!job || !online; li.appendChild(again);
      li.appendChild(document.createTextNode(' '));
      var del = button('Delete downloaded map', function(){
        if(!confirm('Delete the downloaded map "' + a.name + '"?')) return;
        delete graphs[a.id];
        GeoStore.deleteArea(a.id).then(reloadAreas).then(applyBaseMap);
      });
      del.disabled = !!(job && job.area.id === a.id); li.appendChild(del);
      ul.appendChild(li);
    });
    renderStorage();
  }
  function renderStorage(){
    var box = $('storeInfo');
    if(!navigator.storage || !navigator.storage.estimate){ box.textContent = 'Available storage: not reported by this browser.'; return; }
    navigator.storage.estimate().then(function(s){
      box.textContent = 'Available storage: ' + fmtBytes(Math.max(0, s.quota - s.usage)) + ' (' + fmtBytes(s.usage) + ' used by this site).';
      return navigator.storage.persisted ? navigator.storage.persisted() : true;
    }).then(function(kept){
      if(!kept && areas.length) box.textContent += ' The browser may clear downloaded maps if the device runs low on storage.';
    }).catch(function(){});
  }

  // ---- Offline routing, from data saved with a downloaded area
  var graphs = {};    // built road networks: graphs[area id][profile]
  function inBox(bb, p){ return p.lat >= bb.s && p.lat <= bb.n && p.lng >= bb.w && p.lng <= bb.e; }
  function areaWith(pts, field){
    return areas.filter(function(a){
      return a[field] === 'ready' && pts.every(function(p){ return inBox(expand(a.bb), p); });
    })[0];
  }
  function localRoute(pts, profile){
    var a = areaWith(pts, 'roads');
    if(!a) return Promise.reject(new Error('Offline routing needs routing data. Download one area that contains all the points of this route, including routing data. Bird Mode works without it.'));
    var cached = graphs[a.id] && graphs[a.id][profile];
    return (cached ? Promise.resolve(cached) : GeoStore.get('geo', a.id + ':roads').then(function(r){
      var g = GeoRouter.build(r.d, profile);
      (graphs[a.id] = graphs[a.id] || {})[profile] = g;
      return g;
    })).then(function(g){
      var r = GeoRouter.route(g, pts, 500, WALK_MS);
      if(r.error === 'snap') throw new Error(label(pts[r.point]) + ' is too far from any road or path for this travel mode.');
      if(r.error) throw new Error('No route was found in the downloaded data for this travel mode.');
      r.note = 'Calculated offline from downloaded data. Times are estimates.';
      return r;
    });
  }
  function offlineObstacles(pts){
    var a = areaWith(pts, 'obstacles');
    if(!a) return Promise.reject(new Error('Bird Mode - Avoid Obstacles needs obstacle data offline. Download one area that contains all the points of this route, including obstacle data.'));
    return GeoStore.get('geo', a.id + ':obstacles').then(function(r){ return r.d; });
  }

  // ---- Start
  ['gpsColor','fColor','cColor'].forEach(function(id){ fillColors($(id)); });
  Object.keys(RMODES).forEach(function(k){
    var o = document.createElement('option'); o.value = k; o.textContent = RMODES[k][0]; $('rModeSel').appendChild(o);
  });
  plan.via = Array.isArray(plan.via) ? plan.via : [];
  if(!MODES[plan.mode]) plan.mode = 'car';
  if(!RMODES[plan.rmode]) plan.rmode = 'normal';
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  renderList(); renderSelected(); renderPlan(); renderAreas(); renderStatus();
  // Show what this device already has first, so the page works with no connection at all.
  Promise.all([GeoStore.getKV('points'), GeoStore.getKV('links'), sync.load(), reloadAreas()]).then(function(r){
    (r[0] || []).forEach(upsertPoint);
    data.links = r[1] || [];
  }).catch(function(){ say('This browser is blocking storage on the device, so offline features are not available.'); }).then(function(){
    cacheReady = true;
    refreshAll(); normalizePlan(); applyBaseMap(); renderStatus();
    if(!online) fitFirst();
    connect();
    probe();
  });
})();
</script>
</body>
</html>
